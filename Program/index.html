<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Cluster Opt 0.0.10+2
    </title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="diamond">
            ◇
          </span>
          <strong>
            Cluster
          </strong>
          <small>
            v0.0.10+2
          </small>
        </div>
        <div class="menu-wrap">
          <button id="menuBtn">
            檔案⌄
          </button>
          <nav id="menu" hidden>
            <button data-action="new">
              建立新檔
            </button>
            <button data-action="open">
              開啟檔案
            </button>
            <button data-action="save">
              儲存
            </button>
            <button data-action="saveas">
              另存新檔
            </button>
            <button data-action="close">
              關閉分頁
            </button>
            <button data-action="closeall">
              關閉全部
            </button>
            <div class="menu-divider">
            </div>
            <button id="toolBtn" type="button" aria-expanded="false">
              工具 ›
            </button>
            <div id="toolOptions" hidden>
              <button id="languageBtn" type="button" aria-expanded="false">
                語言 ›
              </button>
              <div id="languageOptions" hidden>
                <button data-locale="zh-Hant" type="button">
                  繁體中文 <span class="locale-check"></span>
                </button>
                <button data-locale="en" type="button">
                  English <span class="locale-check"></span>
                </button>
              </div>
              <button id="paletteBtn" type="button" aria-expanded="false">
                介面調色盤 ›
              </button>

            </div>
          </nav>
        </div>
      </header>
      <div id="tabs">
      </div>
      <main id="workspace">
        <div id="empty">
          <div class="bigdiamond">
            ◇
          </div>
          <h1>
            Cluster
          </h1>
          <p>
            選擇「檔案」建立或開啟文件
          </p>
        </div>
        <div id="editorPane" hidden>
          <div id="gutter">
            1
          </div>
          <textarea id="editor" spellcheck="false" wrap="off" aria-label="文件編輯器">
          </textarea>
        </div>
      </main>
      <footer>
        <div class="meter">
          <div id="meterFill">
          </div>
        </div>
        <span id="meterPercent" aria-live="polite" hidden style="font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;min-width:3.5em;text-align:right">0%</span>
        <span id="syncLabel" class="sync-label" aria-live="polite">UNVERIFIED</span>
        <span id="status">
          就緒
        </span>
        <select id="priority" title="存儲優先級">
          <option value="internal">
            內部優先
          </option>
          <option value="external">
            外部優先
          </option>
        </select>
        <span id="filename">
          未命名.txt
        </span>
        <span class="grow">
        </span>
        <span id="position">
          Ln 1, Col 1
        </span>
        <span>
          UTF-8
        </span>
        <span id="fileType">
          純文字
        </span>
      </footer>
    </div>
    <dialog id="paletteDialog" aria-labelledby="paletteTitle">
      <div class="palette-modal-header">
        <div>
          <div class="palette-eyebrow">CLUSTER / APPEARANCE</div>
          <h2 id="paletteTitle">介面調色盤</h2>
        </div>
        <button id="paletteClose" class="palette-close" type="button"
          aria-label="關閉">×</button>
      </div>
      <div class="palette-modal-body">
        <div class="palette-preview" aria-hidden="true">
          <div class="palette-preview-top">
            <span class="palette-preview-dot"></span>
            <span>CLUSTER</span>
            <span class="palette-preview-caption">UI PREVIEW</span>
          </div>
          <div class="palette-preview-content">
            <div class="palette-preview-sidebar"></div>
            <div class="palette-preview-editor">
              <div class="palette-preview-line"></div>
              <div class="palette-preview-line short"></div>
              <div class="palette-preview-line medium"></div>
            </div>
          </div>
        </div>
        <div class="palette-section-title">
          <label id="paletteLabel" for="palettePicker">介面色系 RGB</label>
          <span id="paletteHex">#000000</span>
        </div>
        <div class="palette-picker-row">
          <input id="palettePicker" type="color" value="#000000">
          <span id="paletteHint">選擇顏色以即時預覽整體介面</span>
        </div>
        <div class="palette-channels">
          <label>R <input data-rgb="0" type="number" min="0" max="255"></label>
          <label>G <input data-rgb="1" type="number" min="0" max="255"></label>
          <label>B <input data-rgb="2" type="number" min="0" max="255"></label>
        </div>
        <div class="palette-section-title">
          <span id="palettePresetLabel">端點風格</span>
          <span id="paletteMode">DARK</span>
        </div>
        <div class="palette-presets">
          <button id="paletteDark" type="button">黑色端點</button>
          <button id="paletteLight" type="button">白色端點</button>
        </div>
      </div>
      <div class="palette-modal-footer">
        <span id="paletteFooterHint">設定會自動儲存</span>
        <button id="paletteDone" type="button">完成</button>
      </div>
    </dialog>
    <input type="file" id="fileInput" multiple hidden>
    <script type="module" src="./src/main.js?v=opt010-plus2-save-gutter-1">
    </script>
  </body>
</html>
